<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HealthUp 음성 파이프라인 데모</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#677084; --line:#dfe3ea; --accent:#2f6fed; --ok:#1f9d55; --warn:#d98a00; --bad:#d64545; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#14171d; --card:#1d222b; --fg:#e6e9ef; --muted:#8e97aa; --line:#2d3441; --accent:#6c9bff; --ok:#46c27d; --warn:#f0b13a; --bad:#f06a6a; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, "Noto Sans KR", sans-serif; }
main { max-width:1000px; margin:0 auto; padding:16px; display:grid; gap:12px; grid-template-columns: 1fr 1fr; }
header { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
h1 { font-size:18px; margin:0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
.card h2 { font-size:13px; margin:0 0 8px; color:var(--muted); font-weight:600; }
.wide { grid-column:1/-1; }
button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); cursor:pointer; }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
button:disabled { opacity:.5; cursor:default; }
input[type=text] { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); flex:1; min-width:0; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.badge { padding:2px 12px; border-radius:99px; font-weight:600; color:#fff; background:var(--muted); }
.badge.listening { background:var(--ok); } .badge.thinking { background:var(--warn); }
.badge.speaking { background:var(--accent); } .badge.safety { background:var(--bad); }
.meter { height:10px; background:var(--line); border-radius:5px; overflow:hidden; }
.meter > div { height:100%; width:0; background:var(--ok); transition:width .05s linear; }
.dot { width:12px; height:12px; border-radius:50%; background:var(--line); display:inline-block; }
.dot.on { background:var(--bad); }
#log { height:320px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
.msg { padding:6px 10px; border-radius:8px; max-width:85%; white-space:pre-wrap; }
.msg.user { align-self:flex-end; background:var(--accent); color:#fff; }
.msg.bot { align-self:flex-start; background:var(--bg); border:1px solid var(--line); }
.msg.cut::after { content:" (끊김)"; color:var(--bad); font-size:12px; }
.msg.merged { text-decoration:line-through; opacity:.6; }
.msg.merged::after { content:" (이어 붙임)"; text-decoration:none; display:inline-block; font-size:12px; }
.msg.alt { align-self:flex-end; background:var(--line); color:var(--muted); font-size:13px; }
.msg.judge { align-self:stretch; max-width:100%; background:none; color:var(--muted); font-size:12px; padding:0 4px; }
.epline { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; font-size:13px; font-variant-numeric:tabular-nums; }
.epbar { flex:0 0 220px; height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
.epbar > div { height:100%; width:0; background:var(--warn); }
.hint { color:var(--muted); font-size:12px; }
table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
th, td { text-align:right; padding:3px 6px; border-bottom:1px solid var(--line); }
th:first-child, td:first-child { text-align:left; }
th { color:var(--muted); font-weight:600; }
@media (max-width:700px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>HealthUp 음성 파이프라인 데모</h1>
    <div class="row">
      <span id="engines" class="hint"></span>
      <label id="voiceWrap" class="hint" hidden>목소리 <select id="voice"></select></label>
      <label id="sttWrap" class="hint" hidden>STT <select id="stt"></select></label>
      <label id="epWrap" class="hint" hidden>턴 종료 <select id="endpoint"></select></label>
      <span id="badge" class="badge">대기</span>
      <button id="start" class="primary">시작</button>
      <button id="stopAnswer" disabled>답변 멈춤</button>
    </div>
  </header>

  <section class="card wide" id="epCard" hidden>
    <div class="epline"><div class="epbar"><div id="epFill"></div></div><span id="epWait">-</span>
      <span id="epP">Smart Turn p -</span><span id="epEnd">어미 -</span><span id="epStt">STT -</span></div>
  </section>

  <section class="card">
    <h2>마이크</h2>
    <div class="meter"><div id="level"></div></div>
    <div class="row" style="margin-top:8px">
      <span id="vad" class="dot"></span><span>말하는 중 (VAD)</span>
    </div>
    <div class="row" style="margin-top:8px">
      <label><input type="checkbox" id="bargein" checked> 끼어들기(barge-in)</label>
      <label><input type="checkbox" id="backchannel" checked> 맞장구</label>
      <button id="reset">대화 초기화</button>
      <button id="retry" title="마지막 마이크 발화를 현재 STT로 다시 인식 (새 턴 없음)">다시 인식</button>
    </div>
    <p class="hint">에코로 아바타 소리에 스스로 끊기면 헤드폰을 쓰세요. 끼어들기를 끄면 아바타가 말하는 동안 마이크를 무시합니다(반이중).</p>
  </section>

  <section class="card">
    <h2>텍스트 입력 (마이크 없이 시험)</h2>
    <form id="form" class="row">
      <input type="text" id="text" placeholder="예: 오늘 혈압 알려줘" autocomplete="off">
      <button>보내기</button>
    </form>
    <p id="err" class="hint"></p>
  </section>

  <section class="card wide"><h2>대화</h2><div id="log"></div></section>

  <section class="card wide">
    <h2>턴별 지연 (ms, 실제 발화 끝 기준 — 턴 종료 방식과 무관하게 같은 기준)</h2>
    <table>
      <thead><tr><th>턴</th><th>STT</th><th>→ 턴 확정</th><th>→ LLM 첫 토큰</th><th>→ 첫 청크</th><th>→ 맞장구</th><th>→ TTS 첫 오디오</th><th>→ 재생 시작</th></tr></thead>
      <tbody id="lat"></tbody>
    </table>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
